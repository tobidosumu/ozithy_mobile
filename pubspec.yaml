name: ozithy_mobile
description: "Ozithy packaging marketplace buyer app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Foundation stack — versions verified on pub.dev (latest stable, 2026-11-20).
  # Widely adopted: Riverpod, go_router, Dio, flutter_secure_storage.
  # material_ui: Flutter team's Material library (replaces deprecated material.dart on 3.50+).
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
